name: phase0-dynamorio
on:
  push:
    branches: [phase0-dynamorio]
jobs:
  a:
    if: false
    strategy:
      fail-fast: false
      matrix:
        script: [a-duckdb, a-other]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/${{ matrix.script }}.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.script }}", path: out }
  b:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, docker, dockernp]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/b.sh ${{ matrix.mode }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-b-${{ matrix.mode }}", path: out }
  dec:
    if: false
    strategy:
      fail-fast: false
      matrix:
        script: [d-density]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/${{ matrix.script }}.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.script }}", path: out }
  gohang:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [matrix, min, oldgo]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang.sh ${{ matrix.mode }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang-${{ matrix.mode }}", path: out }
  goevidence:
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: VARIANT=${{ matrix.variant }} bash phase0/gohang-evidence.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-goevidence-${{ matrix.variant }}", path: out }
  gohang2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang2.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang2", path: out }
