name: phase0-dynamorio
on:
  push:
    branches: [phase0-dynamorio]
jobs:
  a:
    if: false
    strategy:
      fail-fast: false
      matrix:
        script: [a-duckdb, a-other]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/${{ matrix.script }}.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.script }}", path: out }
  b:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, docker, dockernp]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/b.sh ${{ matrix.mode }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-b-${{ matrix.mode }}", path: out }
  dec:
    if: false
    strategy:
      fail-fast: false
      matrix:
        script: [d-density]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/${{ matrix.script }}.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-${{ matrix.script }}", path: out }
  gohang:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [matrix, min, oldgo]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang.sh ${{ matrix.mode }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang-${{ matrix.mode }}", path: out }
  goevidence:
    if: false
    strategy:
      fail-fast: false
      matrix:
        variant: [release, debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: VARIANT=${{ matrix.variant }} bash phase0/gohang-evidence.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-goevidence-${{ matrix.variant }}", path: out }
  gohang2:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang2.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang2", path: out }
  gohang3:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [direct, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang3.sh ${{ matrix.mode }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang3-${{ matrix.mode }}", path: out }
  gohang4:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: LOGONLY=1 bash phase0/gohang4.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: out-gohang4, path: "out/gohang4*" }
  drfix:
    strategy:
      fail-fast: false
      matrix:
        side: [patched]
        build: [release, debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/drfix.sh ${{ matrix.side }} ${{ matrix.build }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-drfix-${{ matrix.side }}-${{ matrix.build }}
          path: |
            out/*.txt
            out/*.tsv
            out/*.log
            out/gohang4/table.tsv
  gohang5:
    if: false
    strategy:
      fail-fast: false
      matrix:
        mode: [patched, thread_private, stock]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: bash phase0/gohang5.sh ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang5-${{ matrix.mode }}", path: out }
  gohang6:
    strategy:
      fail-fast: false
      matrix:
        mode: ["patched/-/spin/-/-"]
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: N=200 bash phase0/gohang6.sh "${{ matrix.mode }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-gohang6-${{ strategy.job-index }}", path: out }
  ofloss:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/ofloss.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: out-ofloss, path: out }
  exitrace:
    strategy:
      fail-fast: false
      matrix:
        side: [fork]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: N=100 bash phase0/exitrace.sh ${{ matrix.side }}
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "out-exitrace-${{ matrix.side }}", path: out }
  flagrepro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash phase0/flagrepro.sh
      - if: always()
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
